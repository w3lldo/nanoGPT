<svg width="800" height="900" xmlns="http://www.w3.org/2000/svg" style="background-color: #1a1a2e; font-family: Arial, sans-serif;">
    <defs>
        <!-- Glow effects -->
        <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Arrowheads -->
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3498db" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ecc71" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="400" y="40" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">TRANSFORMER BLOCK ARCHITECTURE</text>
    <text x="400" y="65" fill="#aaaaaa" font-size="16" text-anchor="middle">The "Super-Highway" Residual Stream (Pre-LayerNorm)</text>

    <!-- ==================== MAIN RESIDUAL HIGHWAY ==================== -->
    <!-- The thick main trunk -->
    <path d="M 200 140 L 200 860" fill="none" stroke="#cccccc" stroke-width="6" />
    <text x="180" y="500" fill="#cccccc" font-size="20" font-weight="bold" text-anchor="middle" transform="rotate(-90 180 500)">MAIN RESIDUAL HIGHWAY (x)</text>

    <!-- Input -->
    <text x="200" y="110" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">INPUT x</text>
    <g transform="translate(200, 140)">
        <circle cx="-60" cy="0" r="18" fill="#1a1a2e" stroke="#f1c40f" stroke-width="2" filter="url(#glow-yellow)"/>
        <text x="-60" y="5" fill="#f1c40f" font-size="14" text-anchor="middle">x₁</text>
        <circle cx="-20" cy="0" r="18" fill="#1a1a2e" stroke="#f1c40f" stroke-width="2" filter="url(#glow-yellow)"/>
        <text x="-20" y="5" fill="#f1c40f" font-size="14" text-anchor="middle">x₂</text>
        <circle cx="20" cy="0" r="18" fill="#1a1a2e" stroke="#f1c40f" stroke-width="2" filter="url(#glow-yellow)"/>
        <text x="20" y="5" fill="#f1c40f" font-size="14" text-anchor="middle">x₃</text>
        <circle cx="60" cy="0" r="18" fill="#1a1a2e" stroke="#f1c40f" stroke-width="2" filter="url(#glow-yellow)"/>
        <text x="60" y="5" fill="#f1c40f" font-size="14" text-anchor="middle">x₄</text>
    </g>

    <!-- ==================== ATTENTION BRANCH ==================== -->
    <path d="M 200 190 L 450 190" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-blue)"/>
    <text x="325" y="180" fill="#3498db" font-size="14" text-anchor="middle">Branch copy of x</text>

    <!-- LayerNorm 1 -->
    <rect x="350" y="210" width="200" height="40" rx="10" fill="#1a2530" stroke="#e74c3c" stroke-width="2"/>
    <text x="450" y="235" fill="#e74c3c" font-size="16" font-weight="bold" text-anchor="middle">LayerNorm (ln_1)</text>
    <path d="M 450 250 L 450 280" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Attention Sub-Network -->
    <rect x="300" y="280" width="300" height="150" rx="15" fill="#1a2530" stroke="#3498db" stroke-width="2"/>
    <text x="450" y="310" fill="#3498db" font-size="18" font-weight="bold" text-anchor="middle">CausalSelfAttention</text>
    
    <!-- Mini Attention internals -->
    <g transform="translate(450, 320)">
        <circle cx="-50" cy="20" r="10" fill="#1a1a2e" stroke="#3498db" stroke-width="2"/>
        <circle cx="0" cy="20" r="10" fill="#1a1a2e" stroke="#3498db" stroke-width="2"/>
        <circle cx="50" cy="20" r="10" fill="#1a1a2e" stroke="#3498db" stroke-width="2"/>
        <path d="M 0 -10 L -50 10 M 0 -10 L 0 10 M 0 -10 L 50 10" fill="none" stroke="#3498db" stroke-width="1" opacity="0.5"/>
        <rect x="-80" y="45" width="160" height="30" rx="5" fill="none" stroke="#3498db" stroke-width="1"/>
        <text x="0" y="65" fill="#3498db" font-size="12" text-anchor="middle">Self-Attention Mechanism</text>
        
        <circle cx="-30" cy="95" r="12" fill="#1a1a2e" stroke="#3498db" stroke-width="2" filter="url(#glow-blue)"/>
        <circle cx="0" cy="95" r="12" fill="#1a1a2e" stroke="#3498db" stroke-width="2" filter="url(#glow-blue)"/>
        <circle cx="30" cy="95" r="12" fill="#1a1a2e" stroke="#3498db" stroke-width="2" filter="url(#glow-blue)"/>
    </g>

    <!-- Return Context Updates to Highway (ADD 1) -->
    <path d="M 450 430 L 450 480 L 235 480" fill="none" stroke="#3498db" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="350" y="470" fill="#3498db" font-size="14" font-weight="bold" text-anchor="middle">+ Context Updates</text>

    <!-- ADD 1 NODE on Highway -->
    <circle cx="200" cy="480" r="25" fill="#1a1a2e" stroke="#cccccc" stroke-width="3"/>
    <text x="200" y="488" fill="#cccccc" font-size="24" font-weight="bold" text-anchor="middle">+</text>

    <!-- ==================== MLP BRANCH ==================== -->
    <path d="M 200 550 L 450 550" fill="none" stroke="#2ecc71" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-green)"/>
    <text x="325" y="540" fill="#2ecc71" font-size="14" text-anchor="middle">Branch copy of new x</text>

    <!-- LayerNorm 2 -->
    <rect x="350" y="570" width="200" height="40" rx="10" fill="#1a2530" stroke="#e74c3c" stroke-width="2"/>
    <text x="450" y="595" fill="#e74c3c" font-size="16" font-weight="bold" text-anchor="middle">LayerNorm (ln_2)</text>
    <path d="M 450 610 L 450 640" fill="none" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- MLP Sub-Network -->
    <rect x="250" y="640" width="400" height="150" rx="15" fill="#1a2530" stroke="#2ecc71" stroke-width="2"/>
    <text x="450" y="670" fill="#2ecc71" font-size="18" font-weight="bold" text-anchor="middle">MLP</text>
    
    <!-- MLP Internal Neurons -->
    <g transform="translate(450, 680)">
        <text x="0" y="-15" fill="#2ecc71" font-size="12" text-anchor="middle">c_fc (expands dims 4x)</text>
        <circle cx="-120" cy="10" r="8" fill="#1a1a2e" stroke="#2ecc71" stroke-width="1.5"/>
        <circle cx="-70" cy="10" r="8" fill="#1a1a2e" stroke="#2ecc71" stroke-width="1.5"/>
        <circle cx="-20" cy="10" r="8" fill="#1a1a2e" stroke="#2ecc71" stroke-width="1.5"/>
        <circle cx="30" cy="10" r="8" fill="#1a1a2e" stroke="#2ecc71" stroke-width="1.5"/>
        <circle cx="80" cy="10" r="8" fill="#1a1a2e" stroke="#2ecc71" stroke-width="1.5"/>
        <circle cx="130" cy="10" r="8" fill="#1a1a2e" stroke="#2ecc71" stroke-width="1.5"/>
        
        <rect x="-150" y="30" width="300" height="25" rx="5" fill="none" stroke="#2ecc71" stroke-width="1"/>
        <text x="0" y="47" fill="#2ecc71" font-size="12" text-anchor="middle">GELU Activation</text>
        
        <text x="0" y="75" fill="#2ecc71" font-size="12" text-anchor="middle">c_proj (projects back down)</text>
        <circle cx="-45" cy="95" r="12" fill="#1a1a2e" stroke="#2ecc71" stroke-width="2" filter="url(#glow-green)"/>
        <circle cx="-15" cy="95" r="12" fill="#1a1a2e" stroke="#2ecc71" stroke-width="2" filter="url(#glow-green)"/>
        <circle cx="15" cy="95" r="12" fill="#1a1a2e" stroke="#2ecc71" stroke-width="2" filter="url(#glow-green)"/>
        <circle cx="45" cy="95" r="12" fill="#1a1a2e" stroke="#2ecc71" stroke-width="2" filter="url(#glow-green)"/>

        <!-- Connectors -->
        <path d="M 0 -35 L -120 0 M 0 -35 L -70 0 M 0 -35 L -20 0 M 0 -35 L 30 0 M 0 -35 L 80 0 M 0 -35 L 130 0" fill="none" stroke="#2ecc71" stroke-width="0.5" opacity="0.3"/>
        <path d="M -120 18 L -45 83 M -70 18 L -15 83 M -20 18 L 15 83 M 30 18 L 45 83" fill="none" stroke="#2ecc71" stroke-width="0.5" opacity="0.3"/>
    </g>

    <!-- Return Deep Thoughts to Highway (ADD 2) -->
    <path d="M 450 790 L 450 840 L 235 840" fill="none" stroke="#2ecc71" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="350" y="830" fill="#2ecc71" font-size="14" font-weight="bold" text-anchor="middle">+ Deep Thoughts</text>

    <!-- ADD 2 NODE on Highway -->
    <circle cx="200" cy="840" r="25" fill="#1a1a2e" stroke="#cccccc" stroke-width="3"/>
    <text x="200" y="848" fill="#cccccc" font-size="24" font-weight="bold" text-anchor="middle">+</text>

    <!-- Final Output -->
    <path d="M 200 865 L 200 885" fill="none" stroke="#cccccc" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="200" y="875" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="start" transform="translate(20, 0)">OUTPUT (to next Block)</text>

</svg>
