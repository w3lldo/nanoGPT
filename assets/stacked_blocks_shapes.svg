<svg width="900" height="1500" xmlns="http://www.w3.org/2000/svg" style="background-color: #1a1a2e; font-family: Arial, sans-serif;">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
        </marker>
        <marker id="arrow-thick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3498db" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ecc71" />
        </marker>
        
        <!-- Component templates -->
        <g id="blockTemplate">
            <rect x="0" y="0" width="750" height="380" rx="15" fill="#24243e" stroke="#555577" stroke-width="2"/>
            
            <!-- Highway: Now structurally the main vertical trunk! -->
            <path d="M 60 0 L 60 380" fill="none" stroke="#cccccc" stroke-width="6"/>

            <!-- Left side: Branches -->
            <!-- Attention Branch Start -->
            <path d="M 60 20 L 180 20" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-blue)"/>
            
            <rect x="100" y="40" width="160" height="40" rx="8" fill="#1a2530" stroke="#e74c3c" stroke-width="2"/>
            <text x="180" y="65" fill="#e74c3c" font-size="14" font-weight="bold" text-anchor="middle">LayerNorm 1</text>
            <text x="180" y="85" fill="#cccccc" font-size="12" text-anchor="middle">Shape: (3, 4)</text>

            <path d="M 180 80 L 180 120" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrow-blue)"/>

            <rect x="100" y="120" width="160" height="40" rx="8" fill="#1a2530" stroke="#3498db" stroke-width="2"/>
            <text x="180" y="145" fill="#3498db" font-size="14" font-weight="bold" text-anchor="middle">Self-Attention</text>
            <text x="180" y="165" fill="#cccccc" font-size="12" text-anchor="middle">Output: (3, 4)</text>

            <!-- Merge Attention Updates Back to Highway -->
            <path d="M 180 160 L 180 200 L 85 200" fill="none" stroke="#3498db" stroke-width="3" marker-end="url(#arrow-blue)"/>
            
            <circle cx="60" cy="200" r="18" fill="#1a1a2e" stroke="#cccccc" stroke-width="3"/>
            <text x="60" y="206" fill="#cccccc" font-size="20" font-weight="bold" text-anchor="middle">+</text>

            <!-- MLP Branch Start -->
            <path d="M 60 220 L 180 220" fill="none" stroke="#2ecc71" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-green)"/>

            <rect x="100" y="240" width="160" height="40" rx="8" fill="#1a2530" stroke="#e74c3c" stroke-width="2"/>
            <text x="180" y="265" fill="#e74c3c" font-size="14" font-weight="bold" text-anchor="middle">LayerNorm 2</text>
            <text x="180" y="285" fill="#cccccc" font-size="12" text-anchor="middle">Shape: (3, 4)</text>

            <path d="M 180 280 L 180 320" fill="none" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrow-green)"/>

            <rect x="100" y="320" width="160" height="40" rx="8" fill="#1a2530" stroke="#2ecc71" stroke-width="2"/>
            <text x="180" y="345" fill="#2ecc71" font-size="14" font-weight="bold" text-anchor="middle">MLP</text>
            <text x="180" y="365" fill="#cccccc" font-size="12" text-anchor="middle">Output: (3, 4)</text>

            <!-- Merge MLP Updates Back to Highway -->
            <path d="M 180 360 L 180 375 L 85 375" fill="none" stroke="#2ecc71" stroke-width="3" marker-end="url(#arrow-green)"/>
            
            <circle cx="60" cy="375" r="18" fill="#1a1a2e" stroke="#cccccc" stroke-width="3"/>
            <text x="60" y="381" fill="#cccccc" font-size="20" font-weight="bold" text-anchor="middle">+</text>

            <!-- Right side: Expanded internals -->
            <g transform="translate(300, 40)">
                <!-- Attention Expansion -->
                <rect x="0" y="0" width="420" height="150" rx="8" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="4"/>
                <text x="10" y="20" fill="#3498db" font-size="12" font-style="italic">Attention Internals (4 features total -> 2 heads of 2 features)</text>
                
                <rect x="20" y="40" width="100" height="25" rx="4" fill="#0f3460" stroke="#3498db" stroke-width="1"/>
                <text x="70" y="57" fill="#ffffff" font-size="11" text-anchor="middle">c_attn (Linear)</text>
                <text x="70" y="75" fill="#aaccff" font-size="10" text-anchor="middle">(3, 4) -> (3, 12)</text>
                
                <rect x="150" y="40" width="80" height="25" rx="4" fill="#0f3460" stroke="#3498db" stroke-width="1"/>
                <text x="190" y="57" fill="#ffffff" font-size="11" text-anchor="middle">Split Q,K,V</text>
                <text x="190" y="75" fill="#aaccff" font-size="10" text-anchor="middle">3 × (3, 4)</text>
                
                <rect x="260" y="40" width="140" height="25" rx="4" fill="#0f3460" stroke="#3498db" stroke-width="1"/>
                <text x="330" y="57" fill="#ffffff" font-size="11" text-anchor="middle">Split to 2 Heads</text>
                <text x="330" y="75" fill="#aaccff" font-size="10" text-anchor="middle">Q,K,V become (3, 2)</text>
                
                <rect x="80" y="95" width="160" height="25" rx="4" fill="#0f3460" stroke="#3498db" stroke-width="1"/>
                <text x="160" y="112" fill="#ffffff" font-size="11" text-anchor="middle">Attention (per head)</text>
                <text x="160" y="130" fill="#aaccff" font-size="10" text-anchor="middle">(3,2) @ (2,3) -> (3,3) @ (3,2) -> (3,2)</text>

                <rect x="260" y="95" width="140" height="25" rx="4" fill="#0f3460" stroke="#3498db" stroke-width="1"/>
                <text x="330" y="112" fill="#ffffff" font-size="11" text-anchor="middle">Concat &amp; c_proj</text>
                <text x="330" y="130" fill="#aaccff" font-size="10" text-anchor="middle">(3,4) -> (3,4)</text>

                <!-- Lines inside attention box -->
                <path d="M 120 52 L 150 52" fill="none" stroke="#888888" stroke-width="1" marker-end="url(#arrow)"/>
                <path d="M 230 52 L 260 52" fill="none" stroke="#888888" stroke-width="1" marker-end="url(#arrow)"/>
                <path d="M 330 65 L 330 80 L 160 80 L 160 95" fill="none" stroke="#888888" stroke-width="1" marker-end="url(#arrow)"/>
                <path d="M 240 107 L 260 107" fill="none" stroke="#888888" stroke-width="1" marker-end="url(#arrow)"/>
            </g>

            <g transform="translate(300, 240)">
                <!-- MLP Expansion -->
                <rect x="0" y="0" width="420" height="120" rx="8" fill="none" stroke="#2ecc71" stroke-width="1" stroke-dasharray="4"/>
                <text x="10" y="20" fill="#2ecc71" font-size="12" font-style="italic">MLP Internals (Expansion Factor = 4)</text>
                
                <rect x="40" y="35" width="120" height="25" rx="4" fill="#144a2a" stroke="#2ecc71" stroke-width="1"/>
                <text x="100" y="52" fill="#ffffff" font-size="11" text-anchor="middle">c_fc (Linear)</text>
                <text x="100" y="70" fill="#aaffcc" font-size="10" text-anchor="middle">(3, 4) -> (3, 16)</text>
                
                <rect x="180" y="35" width="70" height="25" rx="4" fill="#144a2a" stroke="#2ecc71" stroke-width="1"/>
                <text x="215" y="52" fill="#ffffff" font-size="11" text-anchor="middle">GELU</text>
                <text x="215" y="70" fill="#aaffcc" font-size="10" text-anchor="middle">(3, 16)</text>
                
                <rect x="270" y="35" width="120" height="25" rx="4" fill="#144a2a" stroke="#2ecc71" stroke-width="1"/>
                <text x="330" y="52" fill="#ffffff" font-size="11" text-anchor="middle">c_proj (Linear)</text>
                <text x="330" y="70" fill="#aaffcc" font-size="10" text-anchor="middle">(3, 16) -> (3, 4)</text>

                <!-- Lines inside MLP box -->
                <path d="M 160 47 L 180 47" fill="none" stroke="#888888" stroke-width="1" marker-end="url(#arrow)"/>
                <path d="M 250 47 L 270 47" fill="none" stroke="#888888" stroke-width="1" marker-end="url(#arrow)"/>
            </g>
            
            <!-- Connection from main flow to expansions -->
            <path d="M 260 140 L 300 140" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="2"/>
            <path d="M 260 340 L 300 340" fill="none" stroke="#2ecc71" stroke-width="1" stroke-dasharray="2"/>
        </g>
    </defs>

    <!-- Title and Initial Input -->
    <text x="450" y="40" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">SHAPE TRANSFORMATIONS ACROSS 3 BLOCKS</text>
    <text x="450" y="65" fill="#aaaaaa" font-size="14" text-anchor="middle">Input Sequence Length (T) = 3 | Embedding Features (C) = 4 | 2 Attention Heads | Head Size = 2</text>
    
    <rect x="60" y="90" width="200" height="40" rx="20" fill="#f1c40f" fill-opacity="0.2" stroke="#f1c40f" stroke-width="2"/>
    <text x="160" y="108" fill="#f1c40f" font-size="16" font-weight="bold" text-anchor="middle">INITIAL INPUT (x)</text>
    <text x="160" y="125" fill="#f1c40f" font-size="14" text-anchor="middle">Shape: (3, 4)</text>
    <path d="M 160 130 L 160 170" fill="none" stroke="#cccccc" stroke-width="6" marker-end="url(#arrow-thick)"/>

    <!-- BLOCK 1 -->
    <text x="180" y="160" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="start">Transformer Block 1</text>
    <use href="#blockTemplate" x="100" y="170" />
    <text x="210" y="535" fill="#cccccc" font-size="14" font-weight="bold" text-anchor="start">Output of Block 1 Shape: (3, 4)</text>
    <path d="M 160 550 L 160 580" fill="none" stroke="#cccccc" stroke-width="6" marker-end="url(#arrow-thick)"/>

    <!-- BLOCK 2 -->
    <text x="180" y="570" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="start">Transformer Block 2</text>
    <use href="#blockTemplate" x="100" y="580" />
    <text x="210" y="945" fill="#cccccc" font-size="14" font-weight="bold" text-anchor="start">Output of Block 2 Shape: (3, 4)</text>
    <path d="M 160 960 L 160 990" fill="none" stroke="#cccccc" stroke-width="6" marker-end="url(#arrow-thick)"/>

    <!-- BLOCK 3 -->
    <text x="180" y="980" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="start">Transformer Block 3</text>
    <use href="#blockTemplate" x="100" y="990" />
    <text x="210" y="1355" fill="#cccccc" font-size="14" font-weight="bold" text-anchor="start">Output of Block 3 Shape: (3, 4)</text>
    <path d="M 160 1370 L 160 1400" fill="none" stroke="#cccccc" stroke-width="6" marker-end="url(#arrow-thick)"/>

    <!-- Final Output -->
    <rect x="60" y="1400" width="200" height="40" rx="20" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="2"/>
    <text x="160" y="1418" fill="#e67e22" font-size="16" font-weight="bold" text-anchor="middle">FINAL BLOCK OUTPUT</text>
    <text x="160" y="1435" fill="#e67e22" font-size="14" text-anchor="middle">Shape: (3, 4)</text>

</svg>
